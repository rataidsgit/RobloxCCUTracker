name: Build iOS App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build project
        run: |
          xcodebuild \
            -project RobloxCCUTracker.xcodeproj \
            -scheme CCUTracker \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "===== VALIDATION / BUILD ERRORS ====="
          grep -B 5 -A 15 -E "error:|warning:|Validation|validate" build.log || true