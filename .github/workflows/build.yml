name: Build iOS App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode
        run: |
          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version
          xcode-select -p

      - name: Check signing environment
        run: |
          echo "========================================"
          echo "SIGNING ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Signing identities:"
          security find-identity -v -p codesigning || true

          echo ""
          echo "Provisioning profiles:"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          if [ -d "$PROFILE_DIR" ]; then
            find "$PROFILE_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.mobileprovision" \
              -print || true
          else
            echo "No provisioning profile directory."
          fi

      - name: Show signing settings
        run: |
          echo "========================================"
          echo "PROJECT SIGNING SETTINGS"
          echo "========================================"

          xcodebuild \
            -project RobloxCCUTracker.xcodeproj \
            -scheme CCUTracker \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY" \
            || true

      - name: Attempt automatic provisioning
        run: |
          echo "========================================"
          echo "ATTEMPTING AUTOMATIC PROVISIONING"
          echo "========================================"

          xcodebuild \
            -project RobloxCCUTracker.xcodeproj \
            -scheme CCUTracker \
            -sdk iphoneos \
            -configuration Debug \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            build

      - name: Check signing results
        if: always()
        run: |
          echo "========================================"
          echo "SIGNING RESULTS"
          echo "========================================"

          echo ""
          echo "Signing identities:"
          security find-identity -v -p codesigning || true

          echo ""
          echo "Provisioning profiles:"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          if [ -d "$PROFILE_DIR" ]; then
            find "$PROFILE_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.mobileprovision" \
              -print || true
          else
            echo "No provisioning profiles."
          fi
