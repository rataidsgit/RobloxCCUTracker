name: Test Apple Developer Tooling

on:
  workflow_dispatch:

jobs:
  developer-tooling-test:
    runs-on: macos-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo ""
          xcode-select -p

      - name: Check Xcode command line tools
        run: |
          echo "========================================"
          echo "XCODE COMMAND LINE TOOLS"
          echo "========================================"

          xcode-select -p
          xcodebuild -showsdks

      - name: Check available Xcode signing commands
        run: |
          echo "========================================"
          echo "SIGNING TOOLING"
          echo "========================================"

          echo "codesign:"
          which codesign
          codesign -h | head -5

          echo ""
          echo "security:"
          which security
          security -h | head -20

          echo ""
          echo "xcodebuild:"
          which xcodebuild

      - name: Check Xcode provisioning capabilities
        run: |
          echo "========================================"
          echo "XCODE PROVISIONING OPTIONS"
          echo "========================================"

          xcodebuild -help | grep -i -E \
            "signing|provision|team|certificate|export" \
            || true

      - name: Check local signing state
        run: |
          echo "========================================"
          echo "LOCAL SIGNING STATE"
          echo "========================================"

          echo "Code signing identities:"
          security find-identity -v -p codesigning || true

          echo ""
          echo "Provisioning profiles:"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          if [ -d "$PROFILE_DIR" ]; then
            find "$PROFILE_DIR" -maxdepth 1 -type f -print
          else
            echo "None"
          fi

      - name: Check Apple development environment
        run: |
          echo "========================================"
          echo "DEVELOPMENT ENVIRONMENT"
          echo "========================================"

          echo "Developer directory:"
          xcode-select -p

          echo ""
          echo "Mac architecture:"
          uname -m

          echo ""
          echo "Available developer tools:"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Inspect signing settings
        run: |
          echo "========================================"
          echo "PROJECT SIGNING SETTINGS"
          echo "========================================"

          xcodebuild \
            -project RobloxCCUTracker.xcodeproj \
            -scheme CCUTracker \
            -showBuildSettings \
            | grep -E \
              "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING|PRODUCT_BUNDLE_IDENTIFIER" \
            || true

      - name: Test unsigned simulator build
        run: |
          echo "========================================"
          echo "BUILD TEST"
          echo "========================================"

          xcodebuild \
            -project RobloxCCUTracker.xcodeproj \
            -scheme CCUTracker \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Finish
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "TEST COMPLETE"
          echo "========================================"
          echo ""
          echo "No Apple credentials were supplied."
          echo "No Apple password was used."
          echo "No 2FA code was used."